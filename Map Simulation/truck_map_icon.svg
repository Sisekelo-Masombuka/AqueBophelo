<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tankTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E7FD1"/>
      <stop offset="50%" stop-color="#0F5AA0"/>
      <stop offset="100%" stop-color="#1E7FD1"/>
    </linearGradient>
    <linearGradient id="cabTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123C6B"/>
      <stop offset="50%" stop-color="#0A2A4F"/>
      <stop offset="100%" stop-color="#123C6B"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="106" rx="52" ry="86" fill="url(#shadow)"/>

  <!-- heading points up (0deg = north); rotate this whole group in your map lib to match bearing -->
  <g>
    <!-- truck bed / tank, top-down, rounded rect with rounded tank ends -->
    <rect x="62" y="34" width="76" height="112" rx="30" fill="url(#tankTop)" stroke="#0A3A6B" stroke-width="2"/>

    <!-- tank ribs -->
    <line x1="72" y1="60" x2="128" y2="60" stroke="#0A3A6B" stroke-width="3" opacity="0.55"/>
    <line x1="72" y1="86" x2="128" y2="86" stroke="#0A3A6B" stroke-width="3" opacity="0.55"/>
    <line x1="72" y1="112" x2="128" y2="112" stroke="#0A3A6B" stroke-width="3" opacity="0.55"/>

    <!-- water drop emblem, centered on tank -->
    <path d="M100 66 C 108 78, 112 85, 112 91 C 112 99, 107 104, 100 104 C 93 104, 88 99, 88 91 C 88 85, 92 78, 100 66 Z" fill="#EAF6FC"/>

    <!-- cab, top-down, sits above tank (front of vehicle) -->
    <rect x="70" y="18" width="60" height="40" rx="10" fill="url(#cabTop)" stroke="#08213C" stroke-width="2"/>
    <!-- windshield -->
    <rect x="78" y="24" width="44" height="14" rx="4" fill="#BFE3F5" opacity="0.9"/>
    <!-- side mirrors -->
    <rect x="60" y="30" width="8" height="6" rx="2" fill="#08213C"/>
    <rect x="132" y="30" width="8" height="6" rx="2" fill="#08213C"/>

    <!-- rear bumper -->
    <rect x="68" y="144" width="64" height="8" rx="3" fill="#08213C"/>

    <!-- direction chevron at the very front, for extra clarity at small sizes -->
    <path d="M100 8 L112 22 L88 22 Z" fill="#0A2A4F"/>
  </g>
</svg>
