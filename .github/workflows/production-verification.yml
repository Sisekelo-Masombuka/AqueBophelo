name: Live Production & Staging Verification

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API URL (e.g. https://api.aquabophelo.app or https://<app-name>.azurewebsites.net)'
        required: true
        default: 'https://api.aquabophelo.app'
      admin_email:
        description: 'Admin email for live authentication verification (optional)'
        required: false
        default: 'admin@aquabophelo.app'

jobs:
  verify-production:
    name: Live Environment Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: |
          chmod +x scripts/deployment-smoke-tests.sh
          chmod +x scripts/verify-e2e-workflows.sh

      - name: 1. Live Deployment Smoke Tests
        run: |
          echo "Targeting live deployment at: ${{ github.event.inputs.target_url }}"
          ./scripts/deployment-smoke-tests.sh "${{ github.event.inputs.target_url }}"

      - name: 2. End-to-End Persona & Operational Workflows
        run: |
          echo "Executing non-destructive workflow verification against: ${{ github.event.inputs.target_url }}"
          ./scripts/verify-e2e-workflows.sh "${{ github.event.inputs.target_url }}" "${{ github.event.inputs.admin_email }}" "${{ secrets.ADMIN_VERIFICATION_PASSWORD || '' }}"
