name: AquaBophelo CI/CD Pipeline

on:
  push:
    branches: [ main, 'security/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 10 & SQL Server)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd2026'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SQLSERVER_CONNECTION_STRING: 'Server=127.0.0.1,1433;Database=master;User Id=sa;Password=YourStrong!Passw0rd2026;TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=true;'
      REQUIRE_SQL_SERVER_TEST: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore Code/backend/AquaBophelo.slnx

      - name: Build Backend Solution
        run: dotnet build Code/backend/AquaBophelo.slnx --configuration Release --no-restore

      - name: Run Backend Unit & Security Tests
        run: dotnet test Code/backend/AquaBophelo.slnx --configuration Release --no-build --verbosity normal

      - name: Scan Backend NuGet Packages for Known Vulnerabilities
        run: dotnet list Code/backend/AquaBophelo.slnx package --vulnerable --include-transitive

  frontend-ci:
    name: Frontend Build & Lint (Node.js 24 & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: Code/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter (oxlint)
        run: npm run lint

      - name: Audit Frontend Dependencies for Vulnerabilities
        run: npm audit --audit-level=high

      - name: Build Frontend SPA
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/main' && (secrets.VITE_API_BASE_URL || 'https://api.aquabophelo.app') || 'http://localhost:5094' }}

      - name: Run Frontend Unit Tests
        run: npm test

  security-audit:
    name: Secret & Credential Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET 10 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Backend for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build Code/backend/AquaBophelo.slnx --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  container-security:
    name: Container Security Scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -f Code/backend/Dockerfile -t aquabophelo-backend:ci Code/backend

      - name: Run Trivy Scanner on Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'aquabophelo-backend:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Docker Image
        run: docker build -f Code/frontend/Dockerfile -t aquabophelo-frontend:ci Code/frontend

      - name: Run Trivy Scanner on Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'aquabophelo-frontend:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
