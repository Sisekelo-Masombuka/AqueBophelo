# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - aquabophelo-web-spu

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies and build frontend
        working-directory: Code/frontend
        env:
          VITE_API_BASE_URL: https://aquabophelo-api-spu-hkahhxcqe0b0c5ek.southafricanorth-01.azurewebsites.net
          VITE_SIGNALR_URL: https://aquabophelo-api-spu-hkahhxcqe0b0c5ek.southafricanorth-01.azurewebsites.net/hubs/trucks
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAFX34am4KffRSjme
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -r Code/frontend/dist deploy-package/
          cp Code/frontend/server.cjs deploy-package/
          cat << 'EOF' > deploy-package/package.json
          {
            "name": "aquabophelo-web",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.cjs"
            }
          }
          EOF

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6047357B0C3A41F1AF83FDD00DB3EF6B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_596348BC1CFA404696420358278F28EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_519B10BAA63F4DCCAC2C18460FC19AA4 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aquabophelo-web-spu'
          slot-name: 'Production'
          package: .