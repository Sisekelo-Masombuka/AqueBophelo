<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="droplet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FC1EC"/>
      <stop offset="55%" stop-color="#1D7FC4"/>
      <stop offset="100%" stop-color="#0C4E8C"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FA9DC"/>
      <stop offset="100%" stop-color="#1D6FA8"/>
    </linearGradient>
    <linearGradient id="house" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FCB5E"/>
      <stop offset="100%" stop-color="#4EA83A"/>
    </linearGradient>
    <linearGradient id="church" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4EA83A"/>
      <stop offset="100%" stop-color="#2E7D2E"/>
    </linearGradient>
    <linearGradient id="truckTank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B5FA8"/>
      <stop offset="100%" stop-color="#0D3B73"/>
    </linearGradient>
    <linearGradient id="truckCab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123C6B"/>
      <stop offset="100%" stop-color="#0A2A4F"/>
    </linearGradient>
    <linearGradient id="swoosh1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D3B73"/>
      <stop offset="100%" stop-color="#1F8A3B"/>
    </linearGradient>
    <linearGradient id="swoosh2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13A6A6"/>
      <stop offset="100%" stop-color="#4EBF5B"/>
    </linearGradient>
    <linearGradient id="wordAqua" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4C8C"/>
      <stop offset="100%" stop-color="#1B6FB0"/>
    </linearGradient>
    <linearGradient id="wordBophelo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9E4F"/>
      <stop offset="100%" stop-color="#1F7A38"/>
    </linearGradient>
  </defs>

  <!-- ===================== ICON CLUSTER ===================== -->
  <g>
    <!-- rear green swoosh (back layer, widest) -->
    <path d="M 40 447 C 180 470, 420 482, 560 440 C 690 400, 800 400, 930 445 L 930 470 C 800 428, 690 428, 560 466 C 415 508, 175 494, 40 452 Z" fill="url(#swoosh1)"/>
    <!-- teal/green mid swoosh -->
    <path d="M 66 452 C 200 472, 415 484, 555 448 C 680 415, 790 413, 905 450 L 905 462 C 790 427, 680 429, 555 460 C 412 497, 195 486, 66 456 Z" fill="url(#swoosh2)"/>

    <!-- Skyline (behind truck / droplet) -->
    <g>
      <!-- green house -->
      <rect x="352" y="352" width="96" height="86" fill="url(#house)"/>
      <polygon points="348,352 400,308 452,352" fill="#3E9430"/>
      <rect x="378" y="392" width="18" height="28" fill="#EAF6E3"/>
      <rect x="406" y="378" width="14" height="14" fill="#EAF6E3"/>

      <!-- blue tower -->
      <rect x="430" y="255" width="66" height="183" fill="url(#tower)"/>
      <rect x="446" y="278" width="10" height="18" fill="#DDF2FC"/>
      <rect x="470" y="278" width="10" height="18" fill="#DDF2FC"/>
      <rect x="446" y="308" width="10" height="18" fill="#DDF2FC"/>
      <rect x="470" y="308" width="10" height="18" fill="#DDF2FC"/>
      <rect x="446" y="338" width="10" height="18" fill="#DDF2FC"/>
      <rect x="470" y="338" width="10" height="18" fill="#DDF2FC"/>

      <!-- church / school -->
      <rect x="496" y="360" width="120" height="78" fill="url(#church)"/>
      <polygon points="496,360 556,325 616,360" fill="#215E22"/>
      <rect x="552" y="300" width="8" height="30" fill="#215E22"/>
      <polygon points="560,300 588,308 560,316" fill="#2E7D2E"/>
      <rect x="546" y="396" width="20" height="42" fill="#EAF6E3"/>
      <rect x="516" y="382" width="14" height="14" fill="#EAF6E3"/>
      <rect x="586" y="382" width="14" height="14" fill="#EAF6E3"/>
    </g>

    <!-- water truck -->
    <g>
      <!-- tank body -->
      <rect x="88" y="358" width="205" height="78" rx="39" fill="url(#truckTank)"/>
      <ellipse cx="127.5" cy="397" rx="8" ry="39" fill="#0A2A4F" opacity="0.35"/>
      <!-- tank rim rings -->
      <rect x="150" y="358" width="6" height="78" fill="#0A2A4F" opacity="0.25"/>
      <rect x="230" y="358" width="6" height="78" fill="#0A2A4F" opacity="0.25"/>
      <!-- water drop emblem on tank -->
      <path d="M188 375 C 200 390, 206 399, 206 407 C 206 417, 198 424, 188 424 C 178 424, 170 417, 170 407 C 170 399, 176 390, 188 375 Z" fill="#EAF6FC"/>

      <!-- cab -->
      <path d="M293 380 h58 c8 0 15 5 18 12 l14 30 h-90 z" fill="url(#truckCab)"/>
      <rect x="308" y="392" width="30" height="22" rx="3" fill="#BFE3F5"/>
      <rect x="293" y="424" width="90" height="12" fill="#0A2A4F"/>

      <!-- wheels -->
      <circle cx="140" cy="440" r="22" fill="#132A3C"/>
      <circle cx="140" cy="440" r="9" fill="#9FB8C8"/>
      <circle cx="250" cy="440" r="22" fill="#132A3C"/>
      <circle cx="250" cy="440" r="9" fill="#9FB8C8"/>
      <circle cx="345" cy="440" r="18" fill="#132A3C"/>
      <circle cx="345" cy="440" r="7" fill="#9FB8C8"/>

      <!-- chassis line -->
      <rect x="88" y="436" width="277" height="6" fill="#0A2A4F"/>
    </g>

    <!-- large water droplet -->
    <g>
      <path d="M 745 218
               C 800 300, 838 348, 838 393
               C 838 440, 797 476, 745 476
               C 693 476, 652 440, 652 393
               C 652 348, 690 300, 745 218 Z"
            fill="url(#droplet)"/>
      <path d="M 706 320 C 692 348, 686 368, 690 384"
            fill="none" stroke="#EAF7FD" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
    </g>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <g font-family="'Poppins','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">
    <text x="179.5" y="555" text-anchor="start" font-size="92" fill="url(#wordAqua)">Aqua</text>
    <text x="434.5" y="555" text-anchor="start" font-size="92" fill="url(#wordBophelo)">Bophelo</text>
  </g>

  <!-- ===================== TAGLINE ===================== -->
  <g font-family="'Poppins','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif">
    <line x1="228" y1="592" x2="298" y2="592" stroke="#123C6B" stroke-width="2.5"/>
    <text x="500" y="600" text-anchor="middle" font-size="25" font-style="italic" font-weight="600" fill="#123C6B">
      Elke druppel tel. Metsi ke bophelo
    </text>
    <line x1="702" y1="592" x2="772" y2="592" stroke="#123C6B" stroke-width="2.5"/>
  </g>
</svg>
