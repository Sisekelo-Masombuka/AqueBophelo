  </defs>

  <!-- Background Base Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#abIconNavy)"/>
  
  <!-- Outer Green Motto Ring/Arc -->
  <path d="M 22 72 C 14 55, 18 35, 34 22 C 42 16, 52 14, 62 16" fill="none" stroke="url(#abIconGreen)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Water Droplet Mark -->
