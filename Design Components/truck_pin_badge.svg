<svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pinBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E7FD1"/>
      <stop offset="100%" stop-color="#0D3B73"/>
    </linearGradient>
    <linearGradient id="tankTop2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAF6FC"/>
      <stop offset="100%" stop-color="#DDF2FC"/>
    </linearGradient>
    <radialGradient id="shadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- drop shadow on the ground -->
  <ellipse cx="100" cy="214" rx="26" ry="7" fill="url(#shadow2)"/>

  <!-- pin (teardrop) -->
  <path d="M100 4
           C 148 4, 182 40, 182 86
           C 182 140, 120 196, 100 206
           C 80 196, 18 140, 18 86
           C 18 40, 52 4, 100 4 Z"
        fill="url(#pinBg)" stroke="#062B52" stroke-width="3"/>
  <!-- inner white plate so the truck glyph pops -->
  <circle cx="100" cy="86" r="58" fill="#FFFFFF"/>

  <!-- simplified top-down truck glyph, in brand navy -->
  <g fill="#0D3B73">
    <rect x="72" y="60" width="56" height="76" rx="22"/>
    <rect x="80" y="40" width="40" height="26" rx="8"/>
    <rect x="88" y="45" width="24" height="9" rx="3" fill="#BFE3F5"/>
  </g>
  <!-- water drop emblem cut out of the tank -->
  <path d="M100 82 C 106 91, 109 96, 109 101 C 109 107, 105 111, 100 111 C 95 111, 91 107, 91 101 C 91 96, 94 91, 100 82 Z" fill="#FFFFFF"/>
</svg>
