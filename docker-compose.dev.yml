services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aquabophelo-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SolPlaatje2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

  backend:
    build:
      context: ./Code/backend
      dockerfile: Dockerfile
    container_name: aquabophelo-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=AquaBopheloDb;User Id=sa;Password=SolPlaatje2026!;TrustServerCertificate=True;
      - Jwt__Key=SolPlaatjeSuperSecretKey2026AquaBopheloHighSecurityKey!
      - Jwt__Issuer=AquaBopheloAPI
      - Jwt__Audience=AquaBopheloClient
      - Jwt__ExpiryMinutes=120
      - SEED_DATABASE=true
    ports:
      - "5094:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./Code/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5094
    container_name: aquabophelo-spa
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mssql_data:
