services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aquabophelo-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

  backend:
    build:
      context: ./Code/backend
      dockerfile: Dockerfile
    container_name: aquabophelo-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=AquaBopheloDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-AquaBopheloAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-AquaBopheloClient}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-120}
      - SEED_DATABASE=${SEED_DATABASE:-false}
      - MIGRATE_ON_START=${MIGRATE_ON_START:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
    ports:
      - "5094:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./Code/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: aquabophelo-spa
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mssql_data:
